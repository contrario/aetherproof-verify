[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aetherproof-verify"
dynamic = ["version"]
description = "Offline verifier for AetherProof v1 signed manifests (Ed25519 + RFC 8785 JCS)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "AetherProof", email = "ops@aetherlang.online" },
]
keywords = [
    "aetherproof",
    "verification",
    "ed25519",
    "signing",
    "code-provenance",
    "jcs",
    "rfc8785",
    "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=46.0.7,<47",
    "pydantic>=2.13,<3",
    "jcs==0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "pip-audit>=2.7",
    "ruff>=0.6",
    "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
aetherproof-verify = "aetherproof_verify.__main__:main"

[project.urls]
Homepage = "https://aetherlang.online"
Source = "https://github.com/contrario/aetherproof-verify"
Issues = "https://github.com/contrario/aetherproof-verify/issues"
"Public Keys" = "https://keys.aetherlang.online"
"Manifest API" = "https://api.aetherlang.online"
"Reproducible Bundle" = "https://releases.aetherlang.online"

[tool.hatch.version]
path = "aetherproof_verify/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["aetherproof_verify"]

[tool.hatch.build.targets.sdist]
include = [
    "/aetherproof_verify",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tools/*" = ["S"]
